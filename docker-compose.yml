services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aicte_workflow
      POSTGRES_USER: aicte
      POSTGRES_PASSWORD: aicte_local
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicte -d aicte_workflow"]
      interval: 5s
      timeout: 3s
      retries: 15

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: aicte
      RABBITMQ_DEFAULT_PASS: aicte_local
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15

  app:
    build: .
    environment:
      PORT: 4173
      DATABASE_URL: postgres://aicte:aicte_local@postgres:5432/aicte_workflow
      AMQP_URL: amqp://aicte:aicte_local@rabbitmq:5672
      DEMO_SEED: "true"
    ports:
      - "4173:4173"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  rabbitmq-data:
