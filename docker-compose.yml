services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aicte_workflow
      POSTGRES_USER: aicte
      POSTGRES_PASSWORD: aicte_local
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicte -d aicte_workflow"]
      interval: 5s
      timeout: 3s
      retries: 15

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: aicte
      RABBITMQ_DEFAULT_PASS: aicte_local
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
  rabbitmq-data:
