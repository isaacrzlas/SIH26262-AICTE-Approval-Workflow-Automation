openapi: 3.0.3
info:
  title: AICTE Approval Workflow Prototype API
  version: 0.2.0
  description: Local prototype API. Authentication and production authorization are not implemented.
servers:
  - url: http://127.0.0.1:4173
paths:
  /api/health:
    get:
      summary: Check API and configured service mode
      responses:
        '200': { description: Health status }
  /api/applications:
    get:
      summary: List applications
      parameters:
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: region, schema: { type: string } }
        - { in: query, name: search, schema: { type: string } }
      responses:
        '200': { description: Application collection }
    post:
      summary: Submit an application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [institutionName, region, instituteType]
              properties:
                institutionName: { type: string, maxLength: 200 }
                region: { type: string, maxLength: 80 }
                instituteType: { type: string, enum: [new, existing] }
      responses:
        '201': { description: Application created }
        '400': { description: Invalid input }
  /api/applications/{id}/stage:
    put:
      summary: Advance, reject, revert, or request clarification
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: Transition result including previous and new stages }
        '409': { description: Invalid workflow transition }
  /api/applications/{id}/audit:
    get:
      summary: Read application audit history
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: Audit entries }
  /api/evc/queue:
    get:
      summary: List applications awaiting an EVC visit
      responses:
        '200': { description: EVC queue }
  /api/evc/schedule:
    post:
      summary: Schedule a local demo EVC session
      responses:
        '201': { description: Schedule created }
        '409': { description: Application already scheduled }
  /api/undertakings:
    get:
      summary: List undertakings across applications
      responses:
        '200': { description: Undertakings }
    post:
      summary: Add an undertaking using the legacy unscoped route
      responses:
        '201': { description: Undertaking created }
  /api/applications/{id}/undertakings:
    get:
      summary: List undertakings for an application
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: Application undertakings }
        '404': { description: Application not found }
    post:
      summary: Create an undertaking for an application
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description, dueDate]
              properties:
                description: { type: string, maxLength: 500 }
                requiredAction: { type: string, maxLength: 500 }
                dueDate: { type: string, format: date }
      responses:
        '201': { description: Undertaking created and audited }
        '400': { description: Invalid input }
        '404': { description: Application not found }
  /api/applications/{id}/compliance-docs:
    get:
      summary: List compliance documents for an application
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: Compliance document metadata }
  /api/undertakings/{id}:
    put:
      summary: Record demo evidence and fulfill an undertaking
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: Evidence validated and undertaking updated }
        '400': { description: Invalid evidence metadata }
        '404': { description: Undertaking not found }
        '409': { description: Undertaking already fulfilled }
  /api/notifications:
    get:
      summary: List recorded compliance reminders and escalations
      responses:
        '200': { description: Alert collection }
